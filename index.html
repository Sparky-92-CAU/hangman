<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman Game</title>


<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>

<body>
  

<div class = "container">

<div class="jumbotron jumbotron-fluid vertical-center">
    <div class="container text-center">
      <a class="home-link" href="https://sparky-92-cau.github.io/portfolio/">Back to Home</a>
      <h1 class="display-4">Hangman Game</h1>
      <p class="lead">Choose a letter or use your keyboard to guess the cocktail.</p>
        <h2>Cocktails</h2>
      <img id="picture" src="assets/drinks.jpg" alt="A selection of cocktails">
      <svg class="hangman-drawing" viewBox="0 0 180 200" role="img" aria-labelledby="hangman-title hangman-description">
        <title id="hangman-title">Hangman progress</title>
        <desc id="hangman-description">The gallows stay visible while one figure segment appears for each incorrect guess.</desc>
        <g class="hangman-scaffold">
          <line x1="25" y1="185" x2="145" y2="185"></line>
          <line x1="65" y1="185" x2="65" y2="20"></line>
          <line x1="65" y1="20" x2="125" y2="20"></line>
          <line x1="125" y1="20" x2="125" y2="42"></line>
        </g>
        <g class="hangman-part"><circle cx="125" cy="60" r="18"></circle></g>
        <g class="hangman-part"><line x1="125" y1="78" x2="125" y2="112"></line></g>
        <g class="hangman-part"><line x1="125" y1="84" x2="111" y2="97"></line></g>
        <g class="hangman-part"><line x1="111" y1="97" x2="98" y2="112"></line></g>
        <g class="hangman-part"><line x1="125" y1="84" x2="139" y2="97"></line></g>
        <g class="hangman-part"><line x1="139" y1="97" x2="152" y2="112"></line></g>
        <g class="hangman-part"><line x1="125" y1="112" x2="112" y2="136"></line></g>
        <g class="hangman-part"><line x1="112" y1="136" x2="100" y2="160"></line></g>
        <g class="hangman-part"><line x1="125" y1="112" x2="138" y2="136"></line></g>
        <g class="hangman-part"><line x1="138" y1="136" x2="150" y2="160"></line></g>
      </svg>
      <h3 id="word" aria-live="polite"></h3>
      <p id="used"></p>
      <p id="guesses"></p>
      <p id="wins" aria-label="Game record"></p>
      <p id="game-status" class="game-status" role="status" aria-live="polite">Guess a letter to begin.</p>
      <div id="keyboard" class="keyboard" aria-label="Choose a letter"></div>
      <button id="new-game" class="btn btn-primary" type="button" hidden>Play Again</button>
    </div>
  </div>
</div>
 



<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

<script src="script.js"></script>

</body>

</html>
